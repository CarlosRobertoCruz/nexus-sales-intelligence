pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 server_tokens off;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
 server {
  listen 8080;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $sales_api http://api:3001;
  client_max_body_size 20m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  location = /healthz { default_type text/plain; return 200 'ok\n'; }
  location = /api/login {
   limit_req zone=login burst=10 nodelay;
   limit_req_status 429;
   proxy_pass $sales_api;
   proxy_set_header Host $host;
   proxy_set_header Origin $http_origin;
   proxy_set_header Connection '';
  }
  location /api/ {
   proxy_pass $sales_api;
   proxy_set_header Host $host;
   proxy_set_header Origin $http_origin;
   proxy_set_header Connection '';
   proxy_read_timeout 300s;
   proxy_send_timeout 60s;
  }
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control 'public, immutable'; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-cache'; }
 }
}
